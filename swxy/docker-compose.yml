name: gsk-poc

services:
  web:
    build:
      context: ./frontend
    ports:
      - "5181:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend/app
      target: final
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:-pg123456}@postgres:5432/gsk"
      ES_HOST: http://elasticsearch:9200
      ES_USER: elastic
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:5181,http://127.0.0.1:5181
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: gsk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pg123456}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gsk"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health >/dev/null"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  uploads:
  postgres_data:
  elasticsearch_data:
  redis_data:
